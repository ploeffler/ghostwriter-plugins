name: validate

# Schnelle Prüfung wie im Hauptrepo ploeffler/GhostWriter (#439, #485, #486):
# - Pull Request: nur die Tests der geänderten Plugins (scripts/select_tests.py);
#   gemeinsame Skripte, Workflows oder Abhängigkeiten: volle Suite; nur Text: keine Tests.
# - Tests parallel je Modul (scripts/run_tests.py).
# - Ein neuer Push bricht den älteren Lauf desselben Branchs bzw. PRs ab.
# - Standard-Branch: Hat ein grüner voller PR-Lauf genau diesen Stand (Baum) schon geprüft,
#   laufen die Tests nicht noch einmal (Artefakt „validate-full-<tree>“).
# - Feature-Branches starten keinen eigenen Push-Lauf, sie werden über ihren PR geprüft.

on:
  push:
    branches-ignore: ['feat/**', 'fix/**', 'docs/**', 'chore/**', 'test/**', 'codex/**', 'claude/**', 'release/**', 'dependabot/**']
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -q -r requirements.txt

      - name: Testumfang bestimmen
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          files="repos/$GITHUB_REPOSITORY/pulls/$PR/files"
          if [ -z "$PR" ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] \
             && run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=validate-full-$tree&per_page=5" \
                      --jq '[.artifacts[] | select(.expired | not) | .workflow_run.id][0] // empty' 2>/dev/null) \
             && [ -n "$run" ] \
             && [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion 2>/dev/null)" = "success" ]; then
            printf 'mode=skip\nplugins=\n' >> "$GITHUB_OUTPUT"
            msg="Tests übersprungen: Stand $tree schon geprüft im Lauf https://github.com/$GITHUB_REPOSITORY/actions/runs/$run"
            echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$PR" ] \
             && gh api "$files" --paginate --jq '.[] | select(.status != "removed") | .filename' > /tmp/changed.txt \
             && gh api "$files" --paginate --jq '.[] | select(.status == "removed" or .status == "renamed") | (.previous_filename // .filename)' > /tmp/removed.txt; then
            python scripts/select_tests.py --files /tmp/changed.txt --removed /tmp/removed.txt --github-output "$GITHUB_OUTPUT"
          else
            printf 'mode=full\nplugins=\n' >> "$GITHUB_OUTPUT"
            echo "Alle Tests"
          fi

      - name: Tests
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          PLUGINS: ${{ steps.scope.outputs.plugins }}
        run: |
          case "$MODE" in
            skip) echo "Keine Tests: derselbe Stand wurde schon im Pull Request vollständig geprüft." ;;
            none) echo "Keine Tests: nur Text geändert." ;;
            subset)
              args=""; for p in $PLUGINS; do args="$args --plugin $p"; done
              echo "Nur die Tests von: $PLUGINS"
              python scripts/run_tests.py $args ;;
            *) python scripts/run_tests.py ;;
          esac

      - name: Geprüften Stand vermerken
        if: github.event_name == 'pull_request' && steps.scope.outputs.mode == 'full'
        run: echo "${{ steps.scope.outputs.tree }}" > /tmp/validate-tree.txt
      - if: github.event_name == 'pull_request' && steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: validate-full-${{ steps.scope.outputs.tree }}
          path: /tmp/validate-tree.txt
          retention-days: 7
